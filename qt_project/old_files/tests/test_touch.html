<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>触摸测试</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #container { width: 100%; height: 100vh; }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            z-index: 9999;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="info">触摸事件调试</div>
    <div id="container"></div>
    
    <script>
        window._AMapSecurityConfig = {
            securityJsCode: '2355cb366c87c99e9733d5266db19854'
        };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=bc9998864f9d289e0913acb4c0554c2e"></script>
    <script>
        var info = document.getElementById('info');
        function log(msg) {
            info.innerHTML += '<br>' + msg;
            console.log(msg);
        }
        
        // 初始化地图
        var map = new AMap.Map('container', {
            zoom: 16,
            center: [114.057868, 22.543099],
            viewMode: '2D',
            dragEnable: true,
            zoomEnable: true,
            rotateEnable: true,
            pitchEnable: false
        });
        
        log('地图初始化完成');
        log('当前缩放: ' + map.getZoom());
        log('当前旋转: ' + map.getRotation());
        
        // 监听缩放
        map.on('zoomchange', function() {
            log('缩放变化: ' + map.getZoom());
        });
        
        // 监听旋转
        map.on('rotatechange', function() {
            log('旋转变化: ' + map.getRotation());
        });
        
        // 触摸事件
        var container = document.getElementById('container');
        container.addEventListener('touchstart', function(e) {
            log('touchstart: ' + e.touches.length + '点');
        }, {passive: false});
        
        container.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                log('双指触摸中...');
            }
        }, {passive: false});
        
        container.addEventListener('touchend', function(e) {
            log('touchend');
        }, {passive: false});
    </script>
</body>
</html>
